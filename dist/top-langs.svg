    .stat-name { font: 600 12.5px 'Fira Code', 'JetBrains Mono', Consolas, monospace; fill: #e6edf3; }
    .stat-pct { font: 700 12.5px 'Fira Code', 'JetBrains Mono', Consolas, monospace; fill: #00FF66; }
